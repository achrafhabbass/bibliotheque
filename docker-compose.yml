version: '3.9'

services:
  oracle-xe:
    image: gvenzl/oracle-xe:21-slim
    container_name: oracle-xe
    environment:
      ORACLE_PASSWORD: oracle123
      APP_USER: biblio
      APP_USER_PASSWORD: biblio123
    ports:
      - "1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s

  bibliotheque:
    build: .
    container_name: bibliotheque-app
    ports:
      - "8081:8080"
    depends_on:
      oracle-xe:
        condition: service_healthy
    environment:
      DB_URL: jdbc:oracle:thin:@oracle-xe:1521/XEPDB1
      DB_USER: biblio
      DB_PASSWORD: biblio123
    restart: on-failure

volumes:
  oracle-data:
