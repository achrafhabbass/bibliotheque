# ─────────────────────────────────────────────────────────────
#  Stack SonarQube self-hosted pour démonstration locale.
#  À utiliser comme alternative pédagogique à SonarCloud.
#
#  Démarrage :  docker compose -f docker-compose.sonarqube.yml up -d
#  Accès   :  http://localhost:9000
#  Login   :  admin / admin (à changer au premier login)
#
#  Analyse manuelle après démarrage :
#    mvn verify sonar:sonar \
#      -Dsonar.host.url=http://localhost:9000 \
#      -Dsonar.token=<token_genere_dans_sonarqube>
# ─────────────────────────────────────────────────────────────

version: '3.9'

services:

  sonarqube-db:
    image: postgres:15-alpine
    container_name: sonarqube-db
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonarqube
    volumes:
      - sonarqube-db-data:/var/lib/postgresql/data
    networks:
      - sonarnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar"]
      interval: 10s
      timeout: 5s
      retries: 10

  sonarqube:
    image: sonarqube:10.4-community
    container_name: sonarqube
    depends_on:
      sonarqube-db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    ports:
      - "9000:9000"
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-extensions:/opt/sonarqube/extensions
      - sonarqube-logs:/opt/sonarqube/logs
    networks:
      - sonarnet
    # SonarQube exige vm.max_map_count >= 262144 sur l'hôte.
    # Sur Linux : sudo sysctl -w vm.max_map_count=262144
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

volumes:
  sonarqube-db-data:
  sonarqube-data:
  sonarqube-extensions:
  sonarqube-logs:

networks:
  sonarnet:
    driver: bridge
